# Build and publish the flowmapper.org Python package (folder python/) with PyPI trusted publishing.
# GENERATED from labgeosocial python/flowmapper/publish/github-workflows by devtools/export_public.py.
#
#   * push a tag vX.Y.Z (equal to src/flowmapper_org/_version.py)  -> tests, build, PyPI
#   * Actions > "Publish Python package" > Run workflow (target)     -> tests, build, TestPyPI or PyPI
#
# One-time setup on pypi.org and test.pypi.org: add a (pending) trusted publisher for project
# "flowmapper-org": owner geo-social, repository flowmapper, workflow python-publish.yml,
# environment "pypi" (resp. "testpypi"). No API token is stored anywhere.
name: Publish Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  tests:
    uses: ./.github/workflows/python-tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Tag must equal the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/flowmapper_org/_version.py').read()).group(1))")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match version v$v"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flowmapper-org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flowmapper-org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
