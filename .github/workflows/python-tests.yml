# Tests of the flowmapper.org Python package (folder python/).
# GENERATED from labgeosocial python/flowmapper/publish/github-workflows by devtools/export_public.py.
name: Python package tests

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python-*.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python-*.yml"]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[interactive]" pytest hypothesis
      # Parity tests need the FlowMapper.org JavaScript sources; they run in the development repository.
      - run: python -m pytest -q -m "not parity"
